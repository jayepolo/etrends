name: Flask App eTrends

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Deploy to tanzu2 (Dokploy) ---------------------------------------
      # Artifact-driven CI/CD (see tanzu2 charter D5): CI builds + pushes the
      # image above (SHA-tagged for pinned rollback); Dokploy pulls and deploys
      # it. This step just POSTs to the app's Dokploy deploy webhook.
      #
      # Requires repo secret DOKPLOY_ETRENDS_WEBHOOK (from the Dokploy app's
      # Deployments -> Webhook URL). Until it's set, the step no-ops so builds
      # keep working. Runs only on push to main, never on PRs.
      - name: Trigger Dokploy deploy (tanzu2)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_ETRENDS_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_ETRENDS_WEBHOOK not set — skipping Dokploy deploy trigger."
            exit 0
          fi
          echo "Triggering Dokploy redeploy for etrends…"
          curl -fsSL -X POST "$DOKPLOY_WEBHOOK"
          echo "Dokploy deploy triggered."

